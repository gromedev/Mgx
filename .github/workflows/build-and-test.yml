name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: windows-latest
    if: github.repository == 'gromedev/mgx'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          # 8.0.x is what src/ targets and ships; 10.0.x is only for the test project,
          # which stays on net10.0 so it can host the newest PowerShell SDK.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Mgx.slnx

      - name: Build module
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      - name: Run xUnit tests
        run: >
          dotnet test tests/Mgx.IntegrationTests/Mgx.IntegrationTests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=xunit-results.trx"
          --results-directory TestResults

      - name: Install test prerequisites
        shell: pwsh
        run: |
          # Pester drives the surface tests. Microsoft.Graph.Authentication is NOT a
          # declared dependency (mgx resolves auth reflectively), so importing works
          # without it - but the live-tagged tests need a real token, so install it here.
          Install-PSResource -Name Pester -TrustRepository -Scope AllUsers
          Install-PSResource -Name Microsoft.Graph.Authentication -TrustRepository -Scope AllUsers

      - name: Run Pester tests
        shell: pwsh
        run: |
          Import-Module ./tests/TestHarness.psm1
          $result = Invoke-TestHarness -IgnoreCodeCoverage
          if ($result.FailedCount -gt 0) {
              throw "$($result.FailedCount) Pester test(s) failed."
          }

      - name: Validate module manifest
        shell: pwsh
        run: |
          Test-ModuleManifest -Path ./module/mgx.psd1 -ErrorAction Stop
          $module = Import-Module ./module/mgx.psd1 -PassThru -ErrorAction Stop
          if ($module.ExportedCmdlets.Count -eq 0) {
              throw 'Module imported but exports no cmdlets.'
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/
            tests/TestResults.xml
          if-no-files-found: ignore

  # The manifest claims PowerShell 7.4+. That claim is only honest if every supported
  # host actually imports the module and passes the surface tests, so each one gets a leg.
  # 7.4 is the LTS floor; without this job the floor is an assertion rather than a result.
  compat:
    name: PowerShell ${{ matrix.psversion }}
    runs-on: windows-latest
    needs: build-and-test
    if: github.repository == 'gromedev/mgx'
    strategy:
      fail-fast: false
      matrix:
        psversion: ['7.4', '7.5', '7.6']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install PowerShell ${{ matrix.psversion }}
        shell: pwsh
        run: |
          dotnet tool install --global PowerShell --version '${{ matrix.psversion }}.*'
          "$env:USERPROFILE\.dotnet\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Build module
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      # Written to a file and invoked with -File rather than passed to -Command. The previous
      # form nested a double-quoted PowerShell command inside a YAML run block and escaped its
      # dollars as \$, which is bash escaping - PowerShell uses a backtick. This step is also the
      # only one in the job that omitted `shell: pwsh`, so the backslashes reached the inner
      # pwsh literally and it died with "The term '\$r.FailedCount' is not recognized" before a
      # single test ran. Every leg of this matrix had been failing that way since 2.0.0, so the
      # 7.4 floor was never actually verified despite the job appearing to test it.
      - name: Import and run surface tests on ${{ matrix.psversion }}
        shell: pwsh
        run: |
          $probe = @'
          "running on PowerShell $($PSVersionTable.PSVersion.ToString())" | Write-Host
          Install-PSResource -Name Pester -TrustRepository -Scope CurrentUser
          Import-Module ./module/mgx.psd1 -ErrorAction Stop
          $r = Invoke-Pester -Path ./tests/Unit -PassThru
          "$($r.PassedCount) passed, $($r.FailedCount) failed" | Write-Host
          if ($r.FailedCount -gt 0) { throw "$($r.FailedCount) test(s) failed" }
          '@
          Set-Content -Path compat-surface-tests.ps1 -Value $probe -Encoding utf8
          pwsh -NoProfile -File ./compat-surface-tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "surface tests failed on PowerShell ${{ matrix.psversion }}" }
